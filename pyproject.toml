[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ai-briefing"
version = "0.1.0"
description = "Daily AI briefing: collect via MCP feed layer, summarize with Gemini, deliver via Gmail."
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "mcp>=1.0.0",
]

[project.optional-dependencies]
panel = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
    "jinja2>=3.1.0",
    "python-multipart>=0.0.9",
    "httpx>=0.27.0",
]
dev = [
    "pytest>=8.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/briefing"]
