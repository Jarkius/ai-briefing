{% extends "base.html" %}
{% block content %}
<h1>Sources</h1>
<p class="muted">Edits land in subscriptions.json; the pipeline reconciles (subscribes) on its next collect run — no live MCP calls from here.</p>

<div class="card">
  <form hx-post="/sources" hx-target="#banner" hx-swap="innerHTML" class="add-source">
    <select name="source_type">
      {% for t in types %}<option value="{{ t }}">{{ t }}</option>{% endfor %}
    </select>
    <input type="text" name="identifier" placeholder="feed URL / @handle / subreddit">
    <input type="text" name="name" placeholder="display name (required)">
    <button type="submit">Add</button>
  </form>
</div>
<div id="banner" role="status" aria-live="polite"></div>

<div class="table-scroll">
<table class="sources-table">
  <thead><tr><th>type</th><th>name</th><th>identifier</th><th>status</th><th></th></tr></thead>
  <tbody>
    {% for s in subs %}
    <tr id="src-row-{{ s.name | replace(' ', '-') | replace('/', '-') | lower }}">
      {% include "_source_row.html" %}
    </tr>
    {% endfor %}
  </tbody>
</table>
</div>
{% endblock %}
